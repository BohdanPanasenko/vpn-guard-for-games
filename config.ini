; vpn-guard-for-games settings
; Changes apply the next time you launch a game. No rebuild needed.

; Network adapters that count as "VPN connected", comma-separated.
; An adapter matches if its description contains any of these words
; (the "Device Name" column in Control Panel > Network Connections).
adapters = NordLayer

; VPN app opened by the "Open ..." button in the dialogs. Leave empty to hide the button.
client = NordLayer

; Before the game starts, if the VPN is connected:
; off  = do nothing
; ask  = wait before launching: the game starts once the VPN is off, or when you click "Play anyway"
; warn = launch the game right away and show a short reminder in the corner of the screen
mode = ask

; After the game closes, if you turned the VPN off for it (sessions under 1 minute are ignored):
; off  = do nothing
; ask  = dialog to turn the VPN back on; it closes by itself once the VPN is connected again
; warn = short reminder in the corner of the screen
reconnect = ask
